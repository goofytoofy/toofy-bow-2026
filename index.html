<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#32151a">
  <meta name="description" content="Toofy BOW 2026 Bingo">
  <title>Toofy BOW 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <p class="eyebrow">THE AUTUMN PUB EDITION</p>
      <h1>Toofy BOW 2026</h1>
    </header>

    <section class="bingo-panel" aria-label="Your bingo card">
      <div class="column-headings" aria-hidden="true">
        <div>B</div><div>O</div><div>W</div><div>2</div><div>6</div>
      </div>
      <div id="bingo-card" class="bingo-card" role="group" aria-label="5 by 5 bingo card">
        <!-- Squares are created by script.js -->
      </div>
      <p id="status" class="status" aria-live="polite">Tap a square to mark it.</p>
    </section>
    <footer class="site-footer">Your card is saved on this device and browser.</footer>
  </main>

  <div id="celebration" class="celebration" aria-live="assertive" aria-atomic="true">
    <div class="celebration-message">BINGO!</div>
  </div>
</body>
</html>
